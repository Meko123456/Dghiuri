name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Dghiuri

      # Sibling checkout consumed via composite build until markdown-blocks:0.1.0 is on Maven Central.
      - uses: actions/checkout@v4
        with:
          repository: Meko123456/markdown-blocks
          path: markdown-blocks

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and unit tests
        working-directory: Dghiuri
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: Dghiuri/app/build/reports/lint-results-debug.html
